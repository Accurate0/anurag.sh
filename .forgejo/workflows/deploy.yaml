name: Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

enable-openid-connect: true

jobs:
  build:
    uses: anurag/workflows/.forgejo/workflows/build-push-image.yaml@main
    with:
      directory: .
      image-name: anurag-sh
      build-args: |
        BINARY_NAME=anurag-sh

  deploy:
    needs:
      - build
    uses: anurag/workflows/.forgejo/workflows/deploy-image.yaml@main
    with:
      service-name: anurag-sh
      images: registry.anurag.sh/containers/anurag-sh
      manifests-path: projects/anurag-sh
      values-file: projects/anurag-sh/image.values.yaml
      tag: ${{ github.sha }}
    secrets:
      CI_IMAGE_UPDATER_TOKEN: ${{ secrets.CI_IMAGE_UPDATER_TOKEN }}
